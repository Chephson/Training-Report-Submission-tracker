name: HCOT P0 security branch tests (no deployment)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-and-regression:
    if: github.ref == 'refs/heads/feature/hcot-unified-integration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build (no deployment)
        run: npm run build
      - name: Check browser JavaScript syntax
        run: node --check public/static/app.js
      - name: HCOT P0 security regression tests
        run: node --experimental-strip-types --test tests/hcot-p0-authorization.test.mjs
      - name: Existing regression suite
        run: node --experimental-strip-types --experimental-loader ./tests/ts-extension-loader.mjs --test tests/*.test.mjs
