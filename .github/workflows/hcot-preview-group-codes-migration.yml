name: HCOT Preview group-code migration (isolated D1 only)
on:
  push:
    branches:
      - feature/hcot-competency-assessment
    paths:
      - .github/workflows/hcot-preview-group-codes-migration.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hcot-preview-d1-migration
  cancel-in-progress: false
jobs:
  migrate-preview-only:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout approved Preview source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 3228e7aafef5618c75684db15bfcf8fce7a5f456
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify Preview D1 binding and production isolation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
        run: |
          set -euo pipefail
          test "$PROJECT_NAME" = "training-report-submission-tracker"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test "$(node -e "console.log(JSON.parse(require('fs').readFileSync('wrangler.jsonc','utf8')).env.preview.d1_databases[0].database_id)")" = "26b2a079-accf-4d05-bf1c-c1e8ca523e1e"
          test "$(node -e "console.log(JSON.parse(require('fs').readFileSync('wrangler.jsonc','utf8')).env.preview.d1_databases[0].database_name)")" = "report-tracker-hcot-preview"
          curl --fail --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT_NAME" > /tmp/project.json
          jq -e '.success == true and .result.production_branch == "main"' /tmp/project.json >/dev/null
          jq -e --arg id "26b2a079-accf-4d05-bf1c-c1e8ca523e1e" '.result.deployment_configs.preview.d1_databases.DB as $d | ($d != null) and (($d.id // $d.database_id // "") == $id)' /tmp/project.json >/dev/null
      - name: Capture Preview D1 recovery bookmark
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 time-travel info DB --env preview
      - name: Record existing Preview mapping counts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute DB --env preview --remote --command "SELECT (SELECT COUNT(*) FROM hcot_competency_groups) AS groups_count,(SELECT COUNT(*) FROM hcot_group_competencies) AS memberships_count,(SELECT COUNT(*) FROM hcot_cadre_groups) AS cadre_links_count,(SELECT COUNT(*) FROM hcot_cadre_group_scopes) AS scoped_links_count;"
      - name: Apply Preview-only group-code migration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute DB --env preview --remote --file migrations/0004_hcot_group_codes_multi_membership.sql
      - name: Verify migrated schema and preserved mapping counts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute DB --env preview --remote --command "SELECT COUNT(*) AS groups_count,COUNT(DISTINCT group_code) AS codes_count FROM hcot_competency_groups;"
          npx wrangler d1 execute DB --env preview --remote --command "SELECT (SELECT COUNT(*) FROM hcot_group_competencies) AS memberships_count,(SELECT COUNT(*) FROM hcot_cadre_groups) AS cadre_links_count,(SELECT COUNT(*) FROM hcot_cadre_group_scopes) AS scoped_links_count;"
          npx wrangler d1 execute DB --env preview --remote --command "PRAGMA foreign_key_check;"
