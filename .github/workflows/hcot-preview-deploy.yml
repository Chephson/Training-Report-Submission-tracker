name: Controlled HCOT Preview deployment
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hcot-preview-manual
  cancel-in-progress: false

jobs:
  deploy-preview:
    if: github.ref == 'refs/heads/feature/hcot-unified-integration'
    runs-on: ubuntu-latest
    steps:
      - name: Verify Preview configuration
        env:
          PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$PROJECT_NAME" || { echo "Missing Pages project name"; exit 1; }
          test -n "$ACCOUNT_ID" || { echo "Missing Cloudflare account ID"; exit 1; }
          test -n "$API_TOKEN" || { echo "Missing Cloudflare API token"; exit 1; }
          test "$PROJECT_NAME" = "training-report-submission-tracker" || { echo "Unexpected Pages project"; exit 1; }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Deploy to Preview branch only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
        run: npx wrangler pages deploy dist --project-name "$PROJECT_NAME" --branch feature/hcot-unified-integration
