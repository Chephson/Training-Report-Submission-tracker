name: Validate HCOT mapping targets (no deployment)
on:
  push:
    branches:
      - feature/hcot-competency-assessment
    paths:
      - .github/workflows/hcot-mapping-targets-validation.yml
      - src/api.ts
      - public/static/app.js
      - migrations/0003_hcot_mapping_competency_targets.sql
      - tests/hcot-mapping-target-policy.test.mjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install and compile (no Cloudflare access)
        run: |
          npm ci
          npm run build
          node --check public/static/app.js
      - name: Run HCOT regression tests (no Cloudflare access)
        run: |
          node --test tests/hcot-competence-levels.test.mjs tests/hcot-competency-assessment.test.mjs tests/hcot-cadre-inheritance.test.mjs tests/hcot-supervisor-gateway-authorization.test.mjs tests/hcot-mapping-target-policy.test.mjs
